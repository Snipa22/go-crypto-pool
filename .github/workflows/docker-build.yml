name: docker-build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "go-crypto-pool-v*"

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, fmt, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test
        run: go test ./...

  docker:
    name: Docker build (${{ matrix.binary }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: backend
            dockerfile: docker/backend/Dockerfile
          - binary: leaf-direct
            dockerfile: docker/leaf-direct/Dockerfile
          - binary: leaf-proxy
            dockerfile: docker/leaf-proxy/Dockerfile
          - binary: leaf-solo
            dockerfile: docker/leaf-solo/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push (and tag `latest`) on version tags. Plain pushes to
      # main build and validate the image but never publish it.
      - name: Determine whether to push
        id: push-gate
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push-gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snipa22/go-crypto-pool-${{ matrix.binary }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.push-gate.outputs.push == 'true' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.push-gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

  # Cross-compiled leaf-proxy release archives. Only built on version
  # tags (never on plain main pushes) — mirrors the docker job's
  # push-gate above.
  #
  # CGO IS NOW ASYMMETRIC ACROSS THESE 4 LEGS -- read before "fixing"
  # the windows leg: linux/amd64, linux/arm64, and darwin/arm64 build
  # with CGO_ENABLED=1 and -tags randomx_cgo, pulling in
  # CgoRandomXValidator (internal/leaflib/validator/factory_cgo.go) —
  # real cgo bindings over tevador/RandomX's reference C++
  # implementation via github.com/mining-pool/go-randomx, which ships
  # prebuilt static libs ONLY for linux/amd64, linux/arm64,
  # darwin/arm64 (confirmed directly against that module's own
  # lib/*.a and its #cgo LDFLAGS selectors in randomx.go — its README
  # also claims darwin/amd64, but no darwin/amd64 .a actually exists
  # in the module as vendored; darwin/amd64 is not a release-archives
  # leg here regardless, so this doesn't affect us, but don't trust
  # that README claim at face value if a 5th leg is ever added).
  # windows/amd64 has NO prebuilt go-randomx lib and no viable
  # cgo/C++-cross-to-Windows-from-Linux path worth taking on here, so
  # it STAYS CGO_ENABLED=0 with no build tag -- it builds
  # PureGoRandomXValidator instead, via
  # validator.NewProxyRandomXValidator()'s build-tag fallback
  # (internal/leaflib/validator/factory.go). That is a real, working,
  # already-tested pure-Go RandomX implementation, just slower
  # (~376ms/hash steady-state vs. the cgo path's ~23.6ms/hash,
  # AMD EPYC 9R14 -benchtime=20x) -- not a stub, not missing
  # functionality, just the one leg where the real tradeoff is cgo's
  # own platform-support ceiling. Do NOT try to force CGO_ENABLED=1
  # onto this leg without first solving go-randomx's missing
  # windows/amd64 static lib.
  release-archives:
    name: Release archive (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on the existing ubuntu-latest (amd64) runner
          # -- no cross-toolchain needed.
          - os: linux
            arch: amd64
            ext: ""
            runs-on: ubuntu-latest
            cgo: "1"
            tags: "randomx_cgo"
          # Cross-compile from the amd64 runner to arm64 -- needs the
          # aarch64 gcc/g++ cross-toolchain installed below and
          # CC/CXX pointed at it, otherwise cgo would try (and fail)
          # to invoke the host's native amd64 gcc against arm64
          # object code.
          - os: linux
            arch: arm64
            ext: ""
            runs-on: ubuntu-latest
            cgo: "1"
            tags: "randomx_cgo"
          # No prebuilt go-randomx static lib for windows/amd64, and
          # cross-compiling cgo+C++ to Windows from Linux is its own
          # large lift -- stays pure-Go (CGO_ENABLED=0, no tag). See
          # this job's header comment above.
          - os: windows
            arch: amd64
            ext: ".exe"
            runs-on: ubuntu-latest
            cgo: "0"
            tags: ""
          # Native build on a real Apple Silicon runner -- no
          # cross-toolchain needed (osxcross cross-compiling cgo+C++
          # from Linux would be a large, fragile lift not justified
          # here when GitHub ships native arm64 macOS runners).
          # macos-15, NOT macos-14 -- macos-14 runners are being
          # retired by GitHub.
          - os: darwin
            arch: arm64
            ext: ""
            runs-on: macos-15
            cgo: "1"
            tags: "randomx_cgo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install aarch64 cross-toolchain (linux/arm64 only)
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build leaf-proxy binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # linux/arm64 is a cross-compile from this amd64 runner --
          # point cgo at the aarch64 toolchain installed above rather
          # than letting it fall back to the host's native amd64 gcc.
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
          fi
          tag_args=()
          if [ -n "${{ matrix.tags }}" ]; then
            tag_args=(-tags "${{ matrix.tags }}")
          fi
          go build -trimpath -ldflags="-s -w" "${tag_args[@]}" \
            -o "dist/leaf-proxy${{ matrix.ext }}" \
            ./cmd/leaf-proxy

      - name: Verify cross-compiled binary architecture (linux/arm64 only)
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          file "dist/leaf-proxy${{ matrix.ext }}"
          file "dist/leaf-proxy${{ matrix.ext }}" | grep -q 'ELF 64-bit.*ARM aarch64' \
            || { echo "expected an ELF aarch64 binary, got something else"; exit 1; }

      - name: Stage and package archive
        id: archive
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          stage_dir="leaf-proxy-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          archive="${stage_dir}.tar.gz"
          mkdir -p "$stage_dir"
          cp "dist/leaf-proxy${{ matrix.ext }}" "$stage_dir/"
          cp cmd/leaf-proxy/leaf-proxy.example.toml "$stage_dir/"
          tar -czf "$archive" "$stage_dir"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

  # Attaches every release-archives matrix leg's tar.gz to the GitHub
  # Release for this tag, creating the Release first if one doesn't
  # already exist (softprops/action-gh-release upserts). Kept as a
  # separate job (rather than uploading from inside the matrix) so
  # the 4 legs don't race each other creating/updating the same
  # Release.
  publish-release:
    name: Publish release archives
    needs: release-archives
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: "leaf-proxy-*.tar.gz"
          path: archives
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: archives/*.tar.gz
